# Panel and tab captions of the ribbon, see src/Gui/Stylesheets/FuCad.qss.
# @TextDisabledColor reads at only 2.5:1 on @PrimaryColor, well under the 4.5:1
# WCAG 2.1 asks of body text. darken() scales the HSV value, so darken(#e8e8e8,
# 45) is #a0a0a0: relative luminance 0.352 against the 0.027 of #2e2e2e, which
# is (0.352 + 0.05) / (0.027 + 0.05) = 5.2:1, and 5.8:1 on the darker tab strip.
RibbonCaptionColor: "darken(@TextForegroundColor, 45)"
